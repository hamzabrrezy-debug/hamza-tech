<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza Tech</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#080e1c;
color:white;
}
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 8%;
background:#101a2d;
}
.logo{font-size:25px;font-weight:bold;color:#38bdf8}
nav a{color:white;text-decoration:none;margin-left:20px}
.hero{
min-height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
}
h1{font-size:55px;margin-bottom:10px}
h1 span{color:#38bdf8}
p{color:#b8c5d8;font-size:18px;line-height:1.7}
button{
background:#0284c7;
color:white;
border:0;
padding:15px 30px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
section{text-align:center;padding:45px 20px}
footer{text-align:center;padding:25px;color:#8794a8}
@media(max-width:600px){
h1{font-size:38px}
nav{padding:20px}
nav a{margin-left:8px;font-size:13px}
}
</style>
</head>
<body>
<nav>
<div class="logo">HAMZA TECH</div>
<div>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</div>
</nav>

<section class="hero" id="home">
<h1>Welcome to <span>Hamza Tech</span></h1>
<p>Building the future with Cloud & Technology.</p>
<button onclick="alert('Welcome to Hamza Tech!')">
Explore Now
</button>
</section>

<section id="about">
<h2>About Hamza Tech</h2>
<p>My journey into Web Development and Cloud Computing starts here.</p>
</section>

<section id="contact">
<h2>Contact</h2>
<p>More exciting projects coming soon.</p>
</section>

<footer>© 2026 Hamza Tech. All rights reserved.</footer>
</body>
</html>
